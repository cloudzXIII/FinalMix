[manifest]
version = "1.2.0"
dump_lua = true
priority = 0

# function Card:flip(), Credits to Bunco for the patch!
# (for Kairi/Namine)
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = "self.facing='back'"
position = "after"
payload = '''
if self.config.center.key == 'j_kh_kairi' and not self.ability.abn_perma_flipped and not self.ability.shadowy_flipped then
    self:flip()
    self:calculate_joker({flip = true})
end
'''
match_indent = true


# Remove "of (suit)" from Card display if you have the Kingdom Key Enhancement [1/2]
[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "localize{type = 'other', key = 'playing_card', set = 'Other', nodes = full_UI_table.name, vars = {localize(specific_vars.value, 'ranks'), localize(specific_vars.suit, 'suits_plural'), colours = {specific_vars.colour}}}"
position = "before"
payload = '''
if SMODS.has_enhancement(card, "m_kh_kingdomkey") then
  localize { type = 'other', key = 'kingdomkey_enh', set = 'Other', nodes = full_UI_table.name, vars = { localize(specific_vars.value, 'ranks') } }
else
'''
match_indent = true

# Remove "of (suit)" from Card display if you have the Kingdom Key Enhancement [2/2]
[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "localize{type = 'other', key = 'playing_card', set = 'Other', nodes = full_UI_table.name, vars = {localize(specific_vars.value, 'ranks'), localize(specific_vars.suit, 'suits_plural'), colours = {specific_vars.colour}}}"
position = "after"
payload = '''
end
'''
match_indent = true


# context.kh_play_cards, Credits to Bunco for the patch!
[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = '''--check the hand first'''
position = 'after'
payload = '''
if G.jokers ~= nil then
    SMODS.calculate_context({kh_play_cards = true})
end
'''
match_indent = true

# For Munny Storm Weather Report
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/utils.lua"]'
pattern = '''from_cashout = SMODS.money_from_cashout or nil,'''
position = "after"
payload = '''
kh_card = effect and effect.source_card or scored_card or nil,
'''
match_indent = true

